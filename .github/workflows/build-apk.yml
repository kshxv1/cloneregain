name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_STR=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VERSION_STR"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | sed -E 's/.*"([0-9]+).*/\1/')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect Java major version." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Detected Java version $JAVA_MAJOR is lower than required version 17." >&2
            exit 1
          fi

          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore" >&2
            exit 1
          fi

          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore
          echo "Temporary debug keystore placed at ./debug.keystore and ~/.android/debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ] && [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp android/app/build/outputs/apk/debug/app-debug.apk "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK missing at $TARGET_APK" >&2
            echo "Searching for generated APK files..."
            find . -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty." >&2
            exit 1
          fi

          echo "Verified debug APK at $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          REPO_NAME="${{ github.repository }}"
          NAME_ONLY="${REPO_NAME##*/}"
          ASSET_NAME="${NAME_ONLY}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Prepared release asset at: $ASSET_PATH"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-v${{ github.run_number }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build #${{ github.run_number }}." \
            --latest

      - name: Report build summary
        if: always()
        run: |
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`app-debug-apk\` (app/build/outputs/apk/debug/app-debug.apk)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "- **GitHub Release**: Published tag \`debug-apk-v${{ github.run_number }}\` with asset \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GitHub Release**: Release step skipped or failed non-fatally; artifact is preserved." >> $GITHUB_STEP_SUMMARY
          fi
