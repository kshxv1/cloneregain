name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Temporary Debug Keystore
        run: |
          echo "Generating temporary debug keystore..."
          keytool -genkeypair -v \
            -keystore ./debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la ./debug.keystore

      - name: Build Android Debug APK
        run: |
          gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Built Debug APK
        id: verify-apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo "0")
            echo "Successfully verified APK at $APK_PATH (Size: $APK_SIZE bytes)"
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Expected APK not found at $APK_PATH" >&2
            find android/app/build -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK Release Asset
        id: prep-asset
        run: |
          REPO_NAME="${{ github.repository }}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '/' '-' | tr -cd '[:alnum:]-_')
          TARGET_APK="$RUNNER_TEMP/${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "$TARGET_APK"
          echo "target_apk=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_APK"

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Stillwater Android Debug Build #${{ github.run_number }}"
          RELEASE_NOTES="### Stillwater Android App - Automated Debug APK Build #${{ github.run_number }}
          
          - **Commit**: \`${{ github.sha }}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **AGP Version**: \`9.1.1\`
          - **Gradle Version**: \`9.3.1\`
          - **Java**: Temurin JDK 17
          
          You can download and install the attached \`.apk\` directly onto any Android phone running Android 8.0+ (API 26+)."

          gh release create "$TAG_NAME" \
            "${{ steps.prep-asset.outputs.target_apk }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Report APK Download Result
        if: always()
        run: |
          echo "## 🌊 Stillwater Android Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run Number**: #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AGP Version**: \`9.1.1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gradle Version**: \`9.3.1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actions Artifact**: \`app-debug-apk\` (available under the Artifacts tab)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.publish-release.outcome }}" == "success" ]; then
            echo "🚀 **GitHub Release Created Successfully!**" >> "$GITHUB_STEP_SUMMARY"
            echo "Release Tag: \`debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ **Artifact Available**: The debug APK has been uploaded to GitHub Actions artifacts as \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
