name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_FULL_VER=$(java -version 2>&1 | head -n 1)
          echo "Full Java version string: $JAVA_FULL_VER"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version." >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Detected Java version $JAVA_MAJOR is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore" >&2
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ] && [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp android/app/build/outputs/apk/debug/app-debug.apk "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK missing at $TARGET_APK" >&2
            echo "Searching only inside app/build/outputs/apk and android/app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            fi
            if [ -d "android/app/build/outputs/apk" ]; then
              find android/app/build/outputs/apk -maxdepth 3 -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty." >&2
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have .apk extension." >&2; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK ($TARGET_APK) is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "Verified exact APK file: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          REPO_NAME="${{ github.repository }}"
          NAME_ONLY="${REPO_NAME##*/}"
          ASSET_NAME="${NAME_ONLY}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Prepared release asset at: $ASSET_PATH"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build #${{ github.run_number }} (attempt ${{ github.run_attempt }})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: #${{ github.run_number }} (Attempt ${{ github.run_attempt }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Actions Artifact**: \`app-debug-apk\` (app/build/outputs/apk/debug/app-debug.apk)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "- **GitHub Release**: Successfully created tag \`$TAG_NAME\` with attached asset \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Download URL**: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GitHub Release**: Skipped or encountered an issue. The debug APK remains safely stored and downloadable under Actions Artifacts as \`app-debug-apk\`." >> $GITHUB_STEP_SUMMARY
          fi
